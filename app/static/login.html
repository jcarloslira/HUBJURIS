<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — LexHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #ECE6D8;
  --panel: #FBF8F2;
  --panel-2: #F1EBDD;
  --panel-3: #E7E0CF;
  --border: #DCD5C5;
  --text: #1D2230;
  --text-dim: #6E6656;
  --accent: #9A6A3A;
  --accent-soft: rgba(154, 106, 58, 0.10);
  --accent-border: rgba(154, 106, 58, 0.38);
  --green: #2E4739;
  --danger: #A4432F;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
}
.card {
  width: 430px; max-width: 100%;
  background: var(--panel);
  border: 1px solid var(--border);
  border-top: 3px solid var(--accent);
  border-radius: 6px 6px 16px 16px;
  box-shadow: 0 24px 60px rgba(29,34,48,.14), 0 2px 8px rgba(29,34,48,.06);
  padding: 34px 34px 28px;
}
.brand { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-bottom: 6px; }
.brand-mark {
  width: 56px; height: 56px;
  border: 1.5px solid var(--accent); border-radius: 50%;
  background: var(--accent-soft); color: var(--accent);
  display: flex; align-items: center; justify-content: center;
}
h1 { font-family: 'Fraunces', serif; font-size: 1.65rem; letter-spacing: .01em; }
h1 span { color: var(--accent); }
.sub { text-align: center; color: var(--text-dim); font-size: 0.85rem; line-height: 1.55; margin: 8px 0 22px; }

.tabs { display: flex; background: var(--panel-3); border-radius: 10px; padding: 4px; margin-bottom: 22px; }
.tab {
  flex: 1; background: transparent; border: none; border-radius: 8px;
  padding: 9px; font-size: 0.85rem; font-weight: 600; color: var(--text-dim);
  cursor: pointer; transition: background .15s, color .15s;
}
.tab.active { background: var(--panel); color: var(--text); box-shadow: 0 1px 3px rgba(29,34,48,.08); }

form { display: flex; flex-direction: column; gap: 14px; }
label { display: flex; flex-direction: column; gap: 6px; font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--text-dim); }
input {
  width: 100%;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 11px 13px;
  font-family: inherit; font-size: 0.9rem; color: var(--text);
  transition: border-color .15s;
}
input:focus { outline: none; border-color: var(--accent-border); }
.btn {
  margin-top: 6px;
  background: var(--accent); color: #fff;
  border: none; border-radius: 10px;
  padding: 13px; font-size: 0.92rem; font-weight: 600;
  cursor: pointer; transition: opacity .15s;
}
.btn:hover { opacity: .92; }
.btn:disabled { opacity: .55; cursor: default; }
.erro {
  display: none;
  background: rgba(164, 67, 47, 0.08);
  border: 1px solid rgba(164, 67, 47, 0.28);
  color: var(--danger);
  border-radius: 10px; padding: 10px 13px;
  font-size: 0.8rem; line-height: 1.45;
}
.rodape { text-align: center; font-size: 0.7rem; color: var(--text-dim); margin-top: 22px; line-height: 1.5; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>

<div class="card">
  <div class="brand">
    <div class="brand-mark">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"/><path d="M5 7l7-4 7 4"/><path d="M3 11l2-4 2 4a2.5 2.5 0 0 1-4 0z"/><path d="M17 11l2-4 2 4a2.5 2.5 0 0 1-4 0z"/><path d="M8 21h8"/></svg>
    </div>
    <h1>Lex<span>Hub</span></h1>
  </div>
  <p class="sub">A equipe de I.A jurídica do seu escritório condominial.</p>

  <div class="tabs">
    <button class="tab active" id="tab-entrar" onclick="trocarAba('entrar')">Entrar</button>
    <button class="tab" id="tab-criar" onclick="trocarAba('criar')">Criar conta</button>
  </div>

  <div class="erro" id="erro"></div>

  <form id="form-entrar" onsubmit="entrar(event)">
    <label>E-mail
      <input type="email" id="login-email" autocomplete="email" required placeholder="voce@escritorio.adv.br">
    </label>
    <label>Senha
      <input type="password" id="login-senha" autocomplete="current-password" required placeholder="••••••••">
    </label>
    <button class="btn" id="btn-entrar" type="submit">Entrar</button>
  </form>

  <form id="form-criar" style="display:none" onsubmit="criarConta(event)">
    <label>Seu nome
      <input type="text" id="cad-nome" autocomplete="name" required placeholder="Dr(a). Nome Sobrenome">
    </label>
    <label>Nome do escritório
      <input type="text" id="cad-escritorio" autocomplete="organization" required placeholder="Ex.: Advocacia Condominial & Associados">
    </label>
    <label>E-mail
      <input type="email" id="cad-email" autocomplete="email" required placeholder="voce@escritorio.adv.br">
    </label>
    <label>Senha <small style="text-transform:none;letter-spacing:0;font-weight:400">(mínimo 8 caracteres)</small>
      <input type="password" id="cad-senha" autocomplete="new-password" minlength="8" required placeholder="••••••••">
    </label>
    <button class="btn" id="btn-criar" type="submit">Criar conta do escritório</button>
  </form>

  <p class="rodape">Ao entrar, você concorda que as respostas são geradas por I.A<br>e devem ser revisadas pelo advogado responsável.</p>
</div>

<script>
const $ = id => document.getElementById(id);

// Já logado? Vai direto pro hub.
if (localStorage.getItem('lexhub_token')) location.replace('/');

function trocarAba(aba) {
  $('form-entrar').style.display = aba === 'entrar' ? 'flex' : 'none';
  $('form-criar').style.display = aba === 'criar' ? 'flex' : 'none';
  $('tab-entrar').classList.toggle('active', aba === 'entrar');
  $('tab-criar').classList.toggle('active', aba === 'criar');
  mostrarErro('');
}

function mostrarErro(msg) {
  const el = $('erro');
  el.textContent = msg;
  el.style.display = msg ? 'block' : 'none';
}

function guardarSessao(d) {
  localStorage.setItem('lexhub_token', d.access_token);
  localStorage.setItem('lexhub_perfil', JSON.stringify(d.perfil));
  location.replace('/');
}

async function chamar(url, corpo, btn, rotulo) {
  mostrarErro('');
  btn.disabled = true; btn.textContent = 'Aguarde…';
  try {
    const r = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(corpo)
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.detail || 'Erro ' + r.status);
    guardarSessao(d);
  } catch (e) {
    mostrarErro(e.message);
  } finally {
    btn.disabled = false; btn.textContent = rotulo;
  }
}

function entrar(ev) {
  ev.preventDefault();
  chamar('/api/auth/login',
    { email: $('login-email').value.trim(), senha: $('login-senha').value },
    $('btn-entrar'), 'Entrar');
}

function criarConta(ev) {
  ev.preventDefault();
  chamar('/api/auth/signup',
    {
      nome: $('cad-nome').value.trim(),
      nome_escritorio: $('cad-escritorio').value.trim(),
      email: $('cad-email').value.trim(),
      senha: $('cad-senha').value
    },
    $('btn-criar'), 'Criar conta do escritório');
}
</script>
</body>
</html>
