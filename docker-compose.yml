services:
  # ── Evolution API (WhatsApp) ──────────────────────────────
  evolution:
    image: atendai/evolution-api:v2.2.3
    restart: always
    ports:
      - "8080:8080"
    environment:
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:evolution@evolution-db:5432/evolution
      - DATABASE_CONNECTION_CLIENT_NAME=evolution
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_DATA_CONTACTS=true
      - DATABASE_SAVE_DATA_CHATS=true
      - LOG_LEVEL=WARN
      - DEL_INSTANCE=false
      - LANGUAGE=pt-BR
    depends_on:
      evolution-db:
        condition: service_healthy
    networks:
      - sdr-network

  # ── PostgreSQL para Evolution API ─────────────────────────
  evolution-db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution
      POSTGRES_DB: evolution
    volumes:
      - evolution-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - sdr-network

  # ── API do Agente SDR (FastAPI) ───────────────────────────
  sdr-api:
    build: .
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - EVOLUTION_API_URL=http://evolution:8080
      - EVOLUTION_INSTANCE=${EVOLUTION_INSTANCE:-lorena}
    depends_on:
      - evolution
    networks:
      - sdr-network

volumes:
  evolution-pgdata:

networks:
  sdr-network:
    driver: bridge
